<head>

<title>VALORANT Tier List</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#fff;color:#17213b;font-family:Arial,"Noto Sans KR",sans-serif}
.board{max-width:1500px;margin:auto;padding:28px;border:1px solid #e2e5ec;border-radius:14px;background:#fff}
h1{margin:0 0 24px;font-size:36px;font-weight:900;letter-spacing:-1.5px}
.tiers{display:flex;flex-direction:column;gap:18px}
.tier{min-height:170px;display:grid;grid-template-columns:12px 90px minmax(0,1fr);border-radius:12px;overflow:hidden;background:#f4f5f8;border:1px solid #edf0f5}
.tier-color{background:var(--tier)}
.tier-label{display:flex;align-items:center;justify-content:center;padding:12px 6px;color:var(--tier);font-size:40px;font-weight:900}
.tier-content{display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:14px;padding:24px 18px;min-width:0}
.agent{width:112px;display:flex;flex-direction:column;align-items:center;gap:7px}
.portrait{width:112px;height:112px;border:4px solid var(--tier);border-radius:15px;overflow:hidden;background:#e7eaf0;display:flex;align-items:center;justify-content:center}
.portrait img{width:100%;height:100%;object-fit:contain;display:block}
.agent-name{font-size:17px;font-weight:650;text-align:center;overflow-wrap:anywhere}
@media(max-width:700px){body{padding:8px}.board{padding:10px;border-radius:8px}h1{font-size:26px;margin-bottom:16px}.tier{grid-template-columns:7px 42px minmax(0,1fr);min-height:100px}.tier-label{font-size:25px;padding:8px 2px}.tier-content{padding:10px 7px;gap:8px}.agent{width:68px;gap:5px}.portrait{width:68px;height:68px;border-width:3px;border-radius:10px}.agent-name{font-size:12px}}
</style>
</head>
